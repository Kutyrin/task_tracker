name: Backend CI/CD

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

jobs:
  backend:
    name: Test and build backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: task_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d task_tracker"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/task_tracker
      JWT_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Build backend
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e

  docker:
    name: Build backend Docker image
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t task-tracker-backend:ci ./backend

  deploy:
    name: Deploy placeholder
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Deployment placeholder
        run: |
          echo "CD pipeline is configured."
          echo "Production deployment is not configured yet."
          echo "Target environment: VPS"
