name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: task-tracker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout tested release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload production Compose from tested release
        run: |
          set -euo pipefail
          test -n "$VPS_APP_DIR"
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          printf -v remote_file '%q' "$VPS_APP_DIR/.docker-compose.prod.$IMAGE_TAG.yml"
          ssh "$VPS_USER@$VPS_HOST" "cat > $remote_file" < docker-compose.prod.yml

      - name: Deploy production
        run: |
          set -euo pipefail
          printf -v remote_command 'bash -s -- %q %q' "$VPS_APP_DIR" "$IMAGE_TAG"
          ssh "$VPS_USER@$VPS_HOST" "$remote_command" <<'REMOTE'
          set -euo pipefail
          cd -- "$1"
          export IMAGE_TAG="$2"
          candidate=".docker-compose.prod.$IMAGE_TAG.yml"
          trap 'rm -f -- "$candidate"' EXIT

          docker compose --env-file .env.production -f "$candidate" config --quiet
          docker compose --env-file .env.production -f "$candidate" config --images

          # Download the entire release before replacing the active configuration.
          for attempt in 1 2 3; do
            if docker compose --env-file .env.production -f "$candidate" pull; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 10))"
          done

          mv -- "$candidate" docker-compose.prod.yml
          docker compose --env-file .env.production -f docker-compose.prod.yml \
            up -d --remove-orphans
          REMOTE
      
      - name: Collect production logs after deployment failure
        if: failure()
        run: |
          ssh "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_APP_DIR' && { \
              docker compose \
                --env-file .env.production \
                -f docker-compose.prod.yml ps -a; \
              docker compose \
                --env-file .env.production \
                -f docker-compose.prod.yml \
                logs --no-color --tail=200 backend postgres frontend; \
            }"

      - name: Wait for application health
        run: |
          ssh "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_APP_DIR' && \
            for i in {1..60}; do \
              if curl -fsS http://127.0.0.1:3001/health >/dev/null && \
                 curl -fsS http://127.0.0.1:3000 >/dev/null; then \
                exit 0; \
              fi; \
              sleep 2; \
            done; \
            docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml \
              ps; \
            docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml \
              logs --tail=200 backend frontend; \
            exit 1"

      - name: Cleanup unused Docker images
        if: success()
        run: |
          ssh "$VPS_USER@$VPS_HOST" \
            "docker image prune -f"
