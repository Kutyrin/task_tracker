name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: task-tracker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy production
        run: |
          ssh "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_APP_DIR' && \
            IMAGE_TAG='$IMAGE_TAG' \
            docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml \
              pull && \
            IMAGE_TAG='$IMAGE_TAG' \
            docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml \
              up -d --remove-orphans"

      - name: Wait for application health
        run: |
          ssh "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_APP_DIR' && \
            for i in {1..60}; do \
              if curl -fsS http://127.0.0.1:3001/health >/dev/null && \
                 curl -fsS http://127.0.0.1:3000 >/dev/null; then \
                exit 0; \
              fi; \
              sleep 2; \
            done; \
            docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml \
              ps; \
            docker compose \
              --env-file .env.production \
              -f docker-compose.prod.yml \
              logs --tail=200 backend frontend; \
            exit 1"

      - name: Cleanup unused Docker images
        if: success()
        run: |
          ssh "$VPS_USER@$VPS_HOST" \
            "docker image prune -f"
