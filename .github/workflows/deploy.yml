name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: task-tracker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout tested release
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload production Compose from tested release
        run: |
          set -euo pipefail
          test -n "$VPS_APP_DIR"
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          printf -v remote_file '%q' "$VPS_APP_DIR/.docker-compose.prod.$IMAGE_TAG.yml"
          ssh "$VPS_USER@$VPS_HOST" "cat > $remote_file" < docker-compose.prod.yml

      - name: Deploy production
        run: |
          set -euo pipefail
          printf -v remote_command 'bash -s -- %q %q' "$VPS_APP_DIR" "$IMAGE_TAG"
          ssh "$VPS_USER@$VPS_HOST" "$remote_command" <<'REMOTE'
          set -euo pipefail
          cd -- "$1"
          export IMAGE_TAG="$2"
          candidate=".docker-compose.prod.$IMAGE_TAG.yml"
          trap 'rm -f -- "$candidate"' EXIT

          docker compose --env-file .env.production -f "$candidate" config --quiet
          docker compose --env-file .env.production -f "$candidate" config --images

          # Download the entire release before replacing the active configuration.
          for attempt in 1 2 3; do
            if docker compose --env-file .env.production -f "$candidate" pull; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 10))"
          done

          mv -- "$candidate" docker-compose.prod.yml
          docker compose --env-file .env.production -f docker-compose.prod.yml \
            up -d --remove-orphans --pull never --wait --wait-timeout 300
          REMOTE
      
      - name: Wait for application health
        run: |
          set -euo pipefail
          printf -v remote_command 'bash -s -- %q %q' "$VPS_APP_DIR" "$IMAGE_TAG"
          ssh "$VPS_USER@$VPS_HOST" "$remote_command" <<'REMOTE'
          set -euo pipefail
          cd -- "$1"
          export IMAGE_TAG="$2"
          for i in {1..60}; do
            if curl --connect-timeout 3 --max-time 5 -fsS http://127.0.0.1:3001/health >/dev/null &&
               curl --connect-timeout 3 --max-time 5 -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo 'Application health check failed'
          exit 1
          REMOTE

      - name: Collect production logs after deployment failure
        if: failure()
        run: |
          set -euo pipefail
          printf -v remote_command 'bash -s -- %q %q' "$VPS_APP_DIR" "$IMAGE_TAG"
          ssh "$VPS_USER@$VPS_HOST" "$remote_command" <<'REMOTE'
          set -euo pipefail
          cd -- "$1"
          export IMAGE_TAG="$2"
          docker compose --env-file .env.production -f docker-compose.prod.yml ps -a
          docker compose --env-file .env.production -f docker-compose.prod.yml \
            logs --no-color --timestamps --since=30m --tail=200 backend postgres frontend
          for service in postgres backend; do
            id=$(docker compose --env-file .env.production -f docker-compose.prod.yml ps -aq "$service")
            if [ -n "$id" ]; then
              docker inspect --format '{{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} restarts={{.RestartCount}} networks={{json .NetworkSettings.Networks}}' "$id"
            fi
          done
          free -m
          df -h .
          # Run a read-only probe from the backend service network, without migrations.
          timeout 30s docker compose --env-file .env.production -f docker-compose.prod.yml \
            run --rm --no-deps -T --entrypoint node backend - <<'NODE' || true
          const { Client } = require('pg');
          const dns = require('node:dns').promises;
          async function check() {
            let url;
            try { url = new URL(process.env.DATABASE_URL); }
            catch { console.error('DATABASE_URL_INVALID'); process.exitCode = 1; return; }
            console.log('Database target:', url.hostname, url.port || '5432');
            try { console.log('Database DNS:', await dns.lookup(url.hostname, { all: true })); }
            catch (error) { console.error('DNS_ERROR', error.code); process.exitCode = 1; return; }
            const client = new Client({ connectionString: process.env.DATABASE_URL, connectionTimeoutMillis: 5000, query_timeout: 5000 });
            client.on('error', (error) => console.error('DATABASE_CONNECTION_ERROR', error.code || error.name));
            try {
              await client.connect();
              await client.query('SELECT 1');
              console.log('DATABASE_OK');
            } catch (error) {
              console.error('DATABASE_ERROR', error.code || error.name);
              process.exitCode = 1;
            } finally { await client.end(); }
          }
          check().catch(() => { console.error('DATABASE_PROBE_FAILED'); process.exitCode = 1; });
          NODE
          REMOTE

      - name: Cleanup unused Docker images
        if: success()
        run: |
          ssh "$VPS_USER@$VPS_HOST" \
            "docker image prune -f"
