name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

permissions:
  contents: read

concurrency:
  group: task-tracker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: task_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d task_tracker"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/task_tracker
      JWT_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Build backend
        run: npm run build

      - name: Run API E2E tests
        run: npm run test:e2e

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create backend environment
        run: |
          cat > backend/.env <<'EOF'
          DATABASE_URL=postgresql://postgres:postgres@postgres:5432/task_tracker
          JWT_SECRET=ci-docker-test-secret
          JWT_REFRESH_SECRET=ci-docker-test-refresh-secret
          PORT=3001
          CORS_ORIGIN=http://localhost:3000
          EOF

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build Docker images
        run: docker compose build

  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Create backend environment
        working-directory: .
        run: |
          cat > backend/.env <<'EOF'
          DATABASE_URL=postgresql://postgres:postgres@postgres:5432/task_tracker
          JWT_SECRET=ci-e2e-test-secret
          JWT_REFRESH_SECRET=ci-e2e-test-refresh-secret
          PORT=3001
          CORS_ORIGIN=http://localhost:3000
          EOF

      - name: Start Docker Compose stack
        working-directory: .
        run: docker compose up -d --build

      - name: Wait for application
        working-directory: .
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:3001/health >/dev/null &&
               curl -fsS http://localhost:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker compose ps
          docker compose logs --tail=100 backend frontend
          exit 1

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

      - name: Show Docker logs on failure
        if: failure()
        working-directory: .
        run: docker compose logs --tail=200

      - name: Stop Docker Compose stack
        if: always()
        working-directory: .
        run: docker compose down -v